# Create a GitHub Release (with large asset) using GITHUB_TOKEN.
# git SSH can push tags/code but cannot call the Releases HTTP API; this workflow bridges that.
# Assets are mirrored from ryan6073/OpenHarmony-x86-Port releases (staging).
name: Publish image release

on:
  push:
    tags:
      - "images-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name
        required: true
        default: images-5.1.0-20261020-displayfix
      asset_url:
        description: URL of the .tar.gz to attach (optional if tag is known)
        required: false
        default: ""
      asset_name:
        description: Asset file name on the release (optional if tag is known)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve tag / asset / notes
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || '' }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          URL="${{ github.event.inputs.asset_url || '' }}"
          NAME="${{ github.event.inputs.asset_name || '' }}"

          case "$TAG" in
            images-5.1.0-20261109-flutter-stayup)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261109-flutter-stayup.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261109 Flutter stay-up)"
              NOTES_KIND=flutter_stayup
              ;;
            images-5.1.0-20261105-flutter-v2)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261105-flutter-v2.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261105 Flutter first-frame fix)"
              NOTES_KIND=flutter_engine
              ;;
            images-5.1.0-20261105-flutter)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261105-flutter.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261105 Flutter engine patch)"
              NOTES_KIND=flutter_engine
              ;;
            images-5.1.0-20261104-flutter)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261104-flutter.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261104 Flutter graphics)"
              NOTES_KIND=flutter
              ;;
            images-5.1.0-20261104-fsverity-codesign)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261104 fs-verity + code_sign)"
              NOTES_KIND=codesign
              ;;
            images-5.1.0-20261020-displayfix)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261020-displayfix.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261020 displayfix)"
              NOTES_KIND=displayfix
              ;;
            *)
              if [ -z "$NAME" ] || [ -z "$URL" ]; then
                echo "Unknown tag=$TAG; pass asset_url and asset_name via workflow_dispatch."
                exit 1
              fi
              TITLE="OpenHarmony x86_general images ($TAG)"
              NOTES_KIND=generic
              ;;
          esac
          [ -n "$URL" ] || URL="https://github.com/ryan6073/OpenHarmony-x86-Port/releases/download/${TAG}/${NAME}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes_kind=$NOTES_KIND" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES_KIND: ${{ steps.meta.outputs.notes_kind }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          if [ "$NOTES_KIND" = "displayfix" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包（非整盘 `.img`，约 1.4G）：解压后执行 `bash disk_assemble.sh ohos_disk.img` 即可拼成可启动盘。

          **20261020-displayfix**：截图非全黑 / 锁屏 UI 可用（QEMU 实测 65,000+ 色）。

          包内含 `USAGE.md`、`disk_assemble.sh`、`final_qa.jpeg`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261020-displayfix.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          https://github.com/guoqiangqi/OpenHarmony-x86-Port （ohos-5.1 补丁 01–06 等）
          EOF
          elif [ "$NOTES_KIND" = "codesign" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包（非整盘 `.img`，约 1.4G）：解压后执行 `bash disk_assemble.sh ohos_disk.img` 即可拼成可启动盘。

          相对 20261020-displayfix：
          - 内核 **#7**：fs-verity + `FS_IOC_ENABLE_CODE_SIGN`
          - data 分区 ext4 **verity** 特性
          - **`libcode_sign_utils.z.so`：x86_64 `SYS_statx=332`**（修复 IsSupportFsVerity errno=22 → 9568393）

          详见包内 `CHANGES-fsverity-codesign.md` / `USAGE.md`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          - `ohos-5.1/patches/07-kernel-fs-verity-enable.patch`
          - `ohos-5.1/patches/08-code-sign-x86-statx-nr.patch`
          EOF
          elif [ "$NOTES_KIND" = "flutter_stayup" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包：解压后 `bash disk_assemble.sh ohos_disk.img`。
          system / vendor / data 与整盘 md5 `d42be74f86b418aafd447e1282153168` 相同。ESP 由脚本按包内 `bzImage` 重建。

          相对 20261105-flutter-v2：

          - preload `f17a315909cadac11b85d035fa3f65ed`：验收 release 改走 Skia，并中和 `dl_sk_dispatcher.cc:328`；debug 引擎 surface `0x17aa8fe` 与 context `0x17aab12` 也改走 Skia。fork 后子进程重新初始化锁，补丁线程在命中前不退出。
          - `libappkit_native.z.so` 看门狗周期 60 秒（md5 `9e93c078`）。
          - `persist.sys.abilityms.timeout_unit_time_ratio = 24`。
          - 内核 `#4 SMP PREEMPT_DYNAMIC Mon Nov 9 00:40:31 CST 2026`：重启后已安装 HAP 仍能打开。四个模块与内核一起更换。

          2026-11-09 在 overlay 上复验：验收 release 与签名 debug 都能出第一帧并留在进程里；`aa force-stop` 后立刻再启动，包括空闲 378 秒的 apppool，也是子进程自己打补丁再出帧。没有新的 cppcrash。debug 引擎仍会打出 `Check failed: false`，进程没有因此退出。

          旧盘 md5 `48012d5c` 只覆盖干净 guest + 验收 release，不要用那张盘验收这一版。

          ## 校验

          ```bash
          tar xzf OpenHarmony-5.1.0-x86_general-images-20261109-flutter-stayup.tar.gz
          cd OpenHarmony-5.1.0-x86_general-images-20261109-flutter-stayup
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码

          - `ohos-5.1/docs/snippets/flutter_qemu_preload.c`
          - `ohos-5.1/docs/FLUTTER-GRAPHICS.md`
          EOF
          elif [ "$NOTES_KIND" = "flutter_engine" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包：解压后 `bash disk_assemble.sh ohos_disk.img`。

          **20261105-flutter-v2（首帧修复版）**：
          - `libvk_icd_force.z.so` v3：新增第二个运行时补丁点——DisplayList 派发表中
            dl_sk_dispatcher.cc(328) 的 fatal-check thunk（libflutter.so vaddr `0x4a2500` /
            file off `0x4a1500`）改写为 `ret`，消除首帧 `Check failed: false` →
            `FML KILL PROCESS` → watchdog 误报
          - 修正候选地址算术（candidates_of 返回段基址+段偏移，各补丁点独立计算）
          - 验收：进程存活 4.5+ 分钟、`first-frame fired`、Flutter 蓝 UI 实际渲染
            （包内 `flutter_firstframe.jpeg`，70% 蓝色像素）、零 SIGSEGV、零 faultlog

          详见包内 `FLUTTER-GRAPHICS.md` / `CHANGES.md` / `USAGE.md`。

          ## 校验

          ```bash
          md5sum OpenHarmony-5.1.0-x86_general-images-20261105-flutter-v2.tar.gz
          # 6fff421a204b92c702a03d8ec65042c9
          tar xzf OpenHarmony-5.1.0-x86_general-images-20261105-flutter-v2.tar.gz
          cd OpenHarmony-5.1.0-x86_general-images-20261105-flutter-v2
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 快速验收

          ```bash
          hdc install hello_world-signed-release.hap
          hdc shell aa start -a EntryAbility -b io.flutter.examples.hello_world
          sleep 30
          hdc shell 'tail -4 /data/log/flpatch.log'
          # 预期两行: PATCHED addr=0x...bca8 + FATAL-THUNK-NEUTRALIZED addr=0x...2500
          ```

          注意：覆盖安装前先 `bm uninstall`；冷启动（TCG）等 SystemUI 就绪 2–3 分钟再
          `aa start`，必要时临时 `param set persist.sys.abilityms.timeout_unit_time_ratio 6`。

          ## 源码

          - `ohos-5.1/docs/snippets/flutter_qemu_preload.c`（commit 70b5845）
          - `ohos-5.1/docs/snippets/screenlock_bypass.c`（commit 4a35f84）
          - `ohos-5.1/docs/FLUTTER-GRAPHICS.md`（原理与排障记录）
          EOF
          elif [ "$NOTES_KIND" = "flutter" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包：解压后 `bash disk_assemble.sh ohos_disk.img`。

          相对 20261104-fsverity-codesign（Flutter 图形）：
          - SwiftShader Vulkan ICD（修 libflutter→libvulkan 空 ICD SIGSEGV）
          - `librender_service` SURFACE 强制 CPU blit（修 egl_no_init 下首帧白屏）
          - `persist.rosen.client_composition.enabled=1`
          - 验收：计数器 Demo 可截图（包内 `flutter_firstframe.jpeg`）

          详见包内 `FLUTTER-GRAPHICS.md` / `CHANGES-flutter-graphics.md` / `USAGE.md`。
          **勿删** `/data/egl_no_init`。HAP 建议 `--enable-software-rendering`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261104-flutter.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          - `ohos-5.1/patches/09-graphic_2d-flutter-surface-forcecpu.patch`
          EOF
          else
            echo "Image package \`$NAME\` for tag \`$TAG\`." > "$NOTES_FILE"
          fi
          # Drop the two-space indent that the YAML block leaves on heredoc lines.
          sed -i 's/^  //' "$NOTES_FILE"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # Newer tags should not steal Latest from displayfix baseline unless intended;
            # leave GitHub default (latest by date).
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Download asset and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          URL: ${{ steps.meta.outputs.url }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fx "$NAME"; then
            echo "Asset $NAME already on release; done"
            exit 0
          fi
          echo "Downloading $URL ..."
          curl -fL --retry 5 --retry-delay 5 -o "$NAME" "$URL"
          ls -lh "$NAME"
          gh release upload "$TAG" "$NAME" -R "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded $NAME to $TAG"
