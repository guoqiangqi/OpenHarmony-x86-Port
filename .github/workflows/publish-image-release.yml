# Create a GitHub Release (with large asset) using GITHUB_TOKEN.
# git SSH can push tags/code but cannot call the Releases HTTP API; this workflow bridges that.
# Assets are mirrored from ryan6073/OpenHarmony-x86-Port releases (staging).
name: Publish image release

on:
  push:
    tags:
      - "images-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name
        required: true
        default: images-5.1.0-20261020-displayfix
      asset_url:
        description: URL of the .tar.gz to attach (optional if tag is known)
        required: false
        default: ""
      asset_name:
        description: Asset file name on the release (optional if tag is known)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve tag / asset / notes
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || '' }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          URL="${{ github.event.inputs.asset_url || '' }}"
          NAME="${{ github.event.inputs.asset_name || '' }}"

          case "$TAG" in
            images-5.1.0-20261104-flutter)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261104-flutter.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261104 Flutter graphics)"
              NOTES_KIND=flutter
              ;;
            images-5.1.0-20261104-fsverity-codesign)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261104 fs-verity + code_sign)"
              NOTES_KIND=codesign
              ;;
            images-5.1.0-20261020-displayfix)
              [ -n "$NAME" ] || NAME="OpenHarmony-5.1.0-x86_general-images-20261020-displayfix.tar.gz"
              TITLE="OpenHarmony 5.1.0 x86_general images (20261020 displayfix)"
              NOTES_KIND=displayfix
              ;;
            *)
              if [ -z "$NAME" ] || [ -z "$URL" ]; then
                echo "Unknown tag=$TAG; pass asset_url and asset_name via workflow_dispatch."
                exit 1
              fi
              TITLE="OpenHarmony x86_general images ($TAG)"
              NOTES_KIND=generic
              ;;
          esac
          [ -n "$URL" ] || URL="https://github.com/ryan6073/OpenHarmony-x86-Port/releases/download/${TAG}/${NAME}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "notes_kind=$NOTES_KIND" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES_KIND: ${{ steps.meta.outputs.notes_kind }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          if [ "$NOTES_KIND" = "displayfix" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包（非整盘 `.img`，约 1.4G）：解压后执行 `bash disk_assemble.sh ohos_disk.img` 即可拼成可启动盘。

          **20261020-displayfix**：截图非全黑 / 锁屏 UI 可用（QEMU 实测 65,000+ 色）。

          包内含 `USAGE.md`、`disk_assemble.sh`、`final_qa.jpeg`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261020-displayfix.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          https://github.com/guoqiangqi/OpenHarmony-x86-Port （ohos-5.1 补丁 01–06 等）
          EOF
          elif [ "$NOTES_KIND" = "codesign" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包（非整盘 `.img`，约 1.4G）：解压后执行 `bash disk_assemble.sh ohos_disk.img` 即可拼成可启动盘。

          相对 20261020-displayfix：
          - 内核 **#7**：fs-verity + `FS_IOC_ENABLE_CODE_SIGN`
          - data 分区 ext4 **verity** 特性
          - **`libcode_sign_utils.z.so`：x86_64 `SYS_statx=332`**（修复 IsSupportFsVerity errno=22 → 9568393）

          详见包内 `CHANGES-fsverity-codesign.md` / `USAGE.md`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          - `ohos-5.1/patches/07-kernel-fs-verity-enable.patch`
          - `ohos-5.1/patches/08-code-sign-x86-statx-nr.patch`
          EOF
          elif [ "$NOTES_KIND" = "flutter" ]; then
            cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包：解压后 `bash disk_assemble.sh ohos_disk.img`。

          相对 20261104-fsverity-codesign（Flutter 图形）：
          - SwiftShader Vulkan ICD（修 libflutter→libvulkan 空 ICD SIGSEGV）
          - `librender_service` SURFACE 强制 CPU blit（修 egl_no_init 下首帧白屏）
          - `persist.rosen.client_composition.enabled=1`
          - 验收：计数器 Demo 可截图（包内 `flutter_firstframe.jpeg`）

          详见包内 `FLUTTER-GRAPHICS.md` / `CHANGES-flutter-graphics.md` / `USAGE.md`。
          **勿删** `/data/egl_no_init`。HAP 建议 `--enable-software-rendering`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261104-flutter.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          - `ohos-5.1/patches/09-graphic_2d-flutter-surface-forcecpu.patch`
          EOF
          else
            echo "Image package \`$NAME\` for tag \`$TAG\`." > "$NOTES_FILE"
          fi
          # Drop the two-space indent that the YAML block leaves on heredoc lines.
          sed -i 's/^  //' "$NOTES_FILE"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # Newer tags should not steal Latest from displayfix baseline unless intended;
            # leave GitHub default (latest by date).
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Download asset and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          URL: ${{ steps.meta.outputs.url }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fx "$NAME"; then
            echo "Asset $NAME already on release; done"
            exit 0
          fi
          echo "Downloading $URL ..."
          curl -fL --retry 5 --retry-delay 5 -o "$NAME" "$URL"
          ls -lh "$NAME"
          gh release upload "$TAG" "$NAME" -R "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded $NAME to $TAG"
