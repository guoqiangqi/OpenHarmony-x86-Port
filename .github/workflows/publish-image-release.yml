# Create a GitHub Release (with large asset) using GITHUB_TOKEN.
# git SSH can push tags/code but cannot call the Releases HTTP API; this workflow bridges that.
name: Publish image release

on:
  push:
    tags:
      - "images-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name
        required: true
        default: images-5.1.0-20261104-fsverity-codesign
      asset_url:
        description: URL of the .tar.gz to attach
        required: true
        default: https://github.com/ryan6073/OpenHarmony-x86-Port/releases/download/images-5.1.0-20261104-fsverity-codesign/OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz
      asset_name:
        description: Asset file name on the release
        required: true
        default: OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve tag / asset
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            URL="${{ github.event.inputs.asset_url }}"
            NAME="${{ github.event.inputs.asset_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
            NAME="OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz"
            URL="https://github.com/ryan6073/OpenHarmony-x86-Port/releases/download/${TAG}/${NAME}"
            if [ "$TAG" != "images-5.1.0-20261104-fsverity-codesign" ]; then
              echo "No default asset mapping for tag=$TAG; use workflow_dispatch with asset_url."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ## 内容

          分区镜像包（非整盘 `.img`，约 1.4G）：解压后执行 `bash disk_assemble.sh ohos_disk.img` 即可拼成可启动盘。

          相对 20261020-displayfix：
          - 内核 **#7**：fs-verity + `FS_IOC_ENABLE_CODE_SIGN`
          - data 分区 ext4 **verity** 特性
          - **`libcode_sign_utils.z.so`：x86_64 `SYS_statx=332`**（修复 IsSupportFsVerity errno=22 → 9568393）

          详见包内 `CHANGES-fsverity-codesign.md` / `USAGE.md`。

          ## 校验

          ```bash
          tar -tzf OpenHarmony-5.1.0-x86_general-images-20261104-fsverity-codesign.tar.gz
          md5sum -c md5.txt
          bash disk_assemble.sh ohos_disk.img
          ```

          ## 源码补丁

          - `ohos-5.1/patches/07-kernel-fs-verity-enable.patch`
          - `ohos-5.1/patches/08-code-sign-x86-statx-nr.patch`
          EOF

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "OpenHarmony 5.1.0 x86_general images (20261104 fs-verity + code_sign)" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Download asset and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          URL: ${{ steps.meta.outputs.url }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fx "$NAME"; then
            echo "Asset $NAME already on release; done"
            exit 0
          fi
          echo "Downloading $URL ..."
          curl -fL --retry 5 --retry-delay 5 -o "$NAME" "$URL"
          ls -lh "$NAME"
          gh release upload "$TAG" "$NAME" -R "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded $NAME to $TAG"
