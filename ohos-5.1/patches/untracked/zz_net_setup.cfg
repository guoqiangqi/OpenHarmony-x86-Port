{
    "jobs" : [{
        "name" : "post-fs-data",
        "cmds" : [
            "exec /system/bin/mknod /dev/fb0 c 29 0",
            "chmod 666 /dev/fb0",
            "exec /system/bin/mknod /dev/hdf c 511 0",
            "chmod 666 /dev/hdf",
            "exec /system/bin/insmod /system/lib/modules/e1000.ko",
            "exec /system/bin/ifconfig eth0 10.0.2.15 netmask 255.255.255.0 up"
        ]
    }]
}
